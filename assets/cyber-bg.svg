<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
    <defs>
        <!-- Deep Dark Background Gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="30%">
            <stop offset="0%" stop-color="#14080e" />
            <stop offset="50%" stop-color="#09090d" />
            <stop offset="100%" stop-color="#050508" />
        </radialGradient>

        <!-- Red Team Accent Glows -->
        <radialGradient id="redGlowHero" cx="50%" cy="15%" r="40%">
            <stop offset="0%" stop-color="#dc2626" stop-opacity="0.14" />
            <stop offset="60%" stop-color="#991b1b" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="redGlowRight" cx="85%" cy="65%" r="35%">
            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.08" />
            <stop offset="70%" stop-color="#7f1d1d" stop-opacity="0.02" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="redGlowLeft" cx="15%" cy="85%" r="35%">
            <stop offset="0%" stop-color="#dc2626" stop-opacity="0.08" />
            <stop offset="70%" stop-color="#450a0a" stop-opacity="0.01" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <!-- Cyber Grid Pattern -->
        <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#261016" stroke-width="0.8" stroke-opacity="0.45" />
            <circle cx="60" cy="0" r="1" fill="#dc2626" fill-opacity="0.4" />
            <circle cx="0" cy="60" r="1" fill="#dc2626" fill-opacity="0.4" />
        </pattern>

        <!-- Hex Pattern -->
        <pattern id="hexPattern" width="120" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
            <path d="M60 0 L120 34.6 L120 104 L60 69.3 L0 104 L0 34.6 Z" fill="none" stroke="#dc2626" stroke-width="0.5" stroke-opacity="0.06" />
        </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="1920" height="1080" fill="url(#bgGrad)" />

    <!-- Ambient Glow Orbs -->
    <rect width="1920" height="1080" fill="url(#redGlowHero)" />
    <rect width="1920" height="1080" fill="url(#redGlowRight)" />
    <rect width="1920" height="1080" fill="url(#redGlowLeft)" />

    <!-- Patterns -->
    <rect width="1920" height="1080" fill="url(#cyberGrid)" />
    <rect width="1920" height="1080" fill="url(#hexPattern)" />

    <!-- Cyber Circuit & Vector Traces -->
    <g opacity="0.35" stroke="#ef4444" stroke-width="1">
        <!-- Top Tech Corner -->
        <path d="M 40 120 L 140 120 L 180 160 L 320 160" fill="none" stroke-opacity="0.3" stroke-dasharray="4 4" />
        <circle cx="40" cy="120" r="3" fill="#dc2626" />
        <circle cx="320" cy="160" r="2.5" fill="#ef4444" />
        <circle cx="180" cy="160" r="2" fill="#ef4444" />

        <!-- Top Right Tech Header -->
        <path d="M 1600 80 L 1750 80 L 1820 150 L 1880 150" fill="none" stroke-opacity="0.35" />
        <circle cx="1880" cy="150" r="3" fill="#dc2626" />
        <circle cx="1600" cy="80" r="2" fill="#ef4444" />

        <!-- Diagonal Circuit Traces across center-right -->
        <path d="M 1400 350 L 1520 470 L 1700 470 L 1760 530" fill="none" stroke-opacity="0.25" />
        <circle cx="1700" cy="470" r="2" fill="#dc2626" />
        <circle cx="1760" cy="530" r="3" fill="#dc2626" />

        <!-- Left Circuit Traces -->
        <path d="M 80 600 L 160 680 L 160 820 L 240 900" fill="none" stroke-opacity="0.25" stroke-dasharray="6 6" />
        <circle cx="80" cy="600" r="2.5" fill="#dc2626" />
        <circle cx="240" cy="900" r="3" fill="#ef4444" />

        <!-- Bottom Tech Framing -->
        <path d="M 600 1020 L 720 1020 L 760 980 L 1160 980 L 1200 1020 L 1320 1020" fill="none" stroke-opacity="0.2" />
        <circle cx="760" cy="980" r="2" fill="#dc2626" />
        <circle cx="1160" cy="980" r="2" fill="#dc2626" />
    </g>

    <!-- Digital Crosshairs / Target Markers -->
    <g opacity="0.28" stroke="#dc2626" stroke-width="1">
        <!-- Marker 1 -->
        <line x1="260" y1="240" x2="280" y2="240" />
        <line x1="270" y1="230" x2="270" y2="250" />
        <circle cx="270" cy="240" r="8" fill="none" stroke-opacity="0.25" />

        <!-- Marker 2 -->
        <line x1="1650" y1="820" x2="1670" y2="820" />
        <line x1="1660" y1="810" x2="1660" y2="830" />
        <circle cx="1660" cy="820" r="8" fill="none" stroke-opacity="0.25" />
    </g>

    <!-- Subtle Tech Code / Binary Watermark / Accents -->
    <g fill="#dc2626" opacity="0.12" font-family="monospace" font-size="11" letter-spacing="3">
        <text x="80" y="100">0x7F_ELF // ARCH_X86_64 // SEC_OFF</text>
        <text x="1560" y="60">SYS_CALL: PTR_AUTH [OK]</text>
        <text x="160" y="960">EXPLOIT_DEV // FUZZ_MODE: ACTIVE</text>
        <text x="1500" y="1020">D34D5H0T03 // RED_TEAM_VULN_RESEARCH</text>
    </g>
</svg>
